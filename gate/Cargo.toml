[package]
name = "tmwa-gate"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Client-facing gateway for The Mana World Athena servers"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
